  <h2 align="center">Add Your Afghani Recipe</h2>

  <center>
    <table border="1" cellpadding="10" cellspacing="0" width="600" bgcolor="white">
      <tr>
        <td>
          <form>
            <b>Recipe Name:</b><br>
            <input type="text" name="name" size="70" required><br><br>

            <b>Ingredients:</b><br>
            <textarea name="ingredients" rows="5" cols="70" required></textarea><br><br>

            <b>Cooking Instructions:</b><br>
            <textarea name="instructions" rows="5" cols="70" required></textarea><br><br>

            <b>Image URL:</b><br>
            <input type="url" name="image" size="70" required><br><br>

            <b>Category:</b><br>
            <select name="category">
              <option value="Drinks">Drinks</option>
              <option value="Foods">Foods</option>
              <option value="desserts">Desserts</option>
            </select><br><br>

            <input type="submit" value="Add Recipe">
          </form>
        </td>
      </tr>
    </table>
  </center>
